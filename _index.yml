indexpage:
  title: Documentation du médiateur ONTAP
  summary: ONTAP Mediator prend en charge les fonctionnalités ONTAP en fournissant
    un stockage persistant et isolé pour les métadonnées de haute disponibilité (HA),
    une fonctionnalité de requête synchrone de l’état des nœuds pour faciliter la
    détermination du quorum, et en servant de proxy ping pour la disponibilité du
    contrôleur.
  keywords: mediator, ONTAP, high-availability, HA, metadata, quorum, controller,
    liveliness, smbc, metrocluster, snapmirrror active sync
  lead: ONTAP Mediator prend en charge la synchronisation active SnapMirror et MetroCluster
    IP en fournissant un stockage persistant et isolé pour les métadonnées de haute
    disponibilité (HA), une fonctionnalité de requête synchrone de l'état des nœuds
    pour faciliter la détermination du quorum, et en servant de proxy ping pour la
    réactivité du contrôleur.
